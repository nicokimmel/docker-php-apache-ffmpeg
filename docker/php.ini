; Disable the early session upload-progress path, not ordinary file uploads.
session.upload_progress.enabled=0
memory_limit=2048M
max_execution_time=240
max_input_vars=1500
upload_max_filesize=2048M
post_max_size=2048M
date.timezone=Europe/Berlin

; Containers do not run Debian's scheduled session-cleanup service.
session.gc_probability=1
session.gc_divisor=1000
